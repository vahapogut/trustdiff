# The shape of a Cargo workspace, which is what ripgrep is: the root package and
# its members are [[package]] tables with no source and no checksum, because Cargo
# builds them from the directory it found them in. They are the repository being
# scanned, not something it installs. Finding F16 of docs/review-2026-09-10.md.
version = 3

[[package]]
name = "trustdiff-fixture-cli"
version = "14.1.1"
dependencies = [
 "trustdiff-fixture-matcher",
 "trustdiff-fixture-printer",
 "memchr",
]

[[package]]
name = "trustdiff-fixture-matcher"
version = "0.1.7"
dependencies = [
 "memchr",
]

[[package]]
name = "trustdiff-fixture-printer"
version = "0.2.1"

[[package]]
name = "memchr"
version = "2.7.4"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "78ca9ab1a0babb1e7d5695e3530886289c18cf2f87ec19a575a0abdce112e3a3"
