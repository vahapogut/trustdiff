# Records docs/demo.gif from docs/demo.tape with vhs and commits the result back.
#
# It took nine runs to produce a first GIF. The cause was the vhs version: v0.12.0
# prints that it is creating the file, exits 0 and writes nothing on this runner
# image. The pin below is v0.11.0 and the comment there says why. docs/demo.tape
# records what else was ruled out on the way.
#
# Manual only (workflow_dispatch): the recording talks to the live registries and
# changes a binary file, so it runs when someone decides the demo is stale, on the
# branch they select in the dispatch dialog, and never on push or pull request.
#
# Every "uses:" reference is pinned to a full commit SHA and the trailing comment names
# the tag. Pins were resolved on 2026-09-09 with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object | "\(.type) \(.sha)"'
# and, for vhs-action, whose tag is annotated, dereferenced with
#   gh api repos/<owner>/<repo>/git/tags/<sha> --jq .object.sha
# so the workflow pins the commit and not the tag object:
#   actions/checkout v7.0.1           3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go v7.0.0           b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   charmbracelet/vhs-action v2.1.1   f6d7db07a432fcd3b06772628d36a57f96d95dcf
#                                     (tag object 60ed28058cc5ec1ac4edbf3a6380a1ea17b89c42)
#   actions/upload-artifact v7.0.1    043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact v6.0.0  018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
#
# Two jobs, and the split is the point. The recording job runs vhs, which installs
# ttyd and ffmpeg of its own and downloads fonts, and it has no token and no
# credentials in its checkout: nothing it installs can reach this repository. The
# commit job has the token, downloads one artifact, and runs nothing it did not
# bring itself. They used to be one job with contents: write and
# persist-credentials: true live from the first step, which meant the write
# credential sat on disk while third-party installers ran. Finding F24 of
# docs/review-2026-09-10.md.

name: demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  # Use exactly the Go version the job installed, as the other workflows do.
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  record:
    name: record docs/demo.gif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No write, and the checkout below keeps no credentials. vhs installs ttyd and
    # ffmpeg and fetches fonts in this job, and none of that can write here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest 1.26 patch release, as in ci.yml; go-version-file would install
          # the bare "go 1.26.0" directive version because GOTOOLCHAIN is local.
          go-version: "1.26.x"
          check-latest: true

      - name: Build trustdiff and put it on PATH for the tape
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          version=$(git describe --tags --always)
          go build -trimpath \
            -ldflags "-s -w -X github.com/vahapogut/trustdiff/internal/version.Version=${version}" \
            -o "$RUNNER_TEMP/bin/trustdiff" ./cmd/trustdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Make sure ffmpeg is there, because vhs encodes the GIF with it
        # vhs shells out to ffmpeg and does not check for it: with ffmpeg missing it
        # prints "Creating docs/demo.gif..." and then the publish hint, exits 0, and
        # writes no file. That is what three runs on 2026-09-09 and two on 2026-09-10
        # looked like from the outside, and the 300 milliseconds between those two
        # lines is the tell, since encoding twenty seconds of terminal takes longer.
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "ffmpeg is not on this runner image; installing it"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -1
          fi

      - name: Warm the cache before recording
        # The tape used to do this itself inside a Hide block. Frame capture is what
        # Show turns back on, so anything wrong there produces an empty recording and
        # a GIF that is never written, which is what this job did for two days. It
        # belongs in a shell step regardless: the recording should show the tool, not
        # the network, and the npm downloads API answers 429 to shared CI addresses
        # often enough that an unwarmed run would be slow on camera.
        run: |
          trustdiff check npm:express@4.19.2 pypi:requests cargo:serde >/dev/null 2>&1 || true
          echo "cache warmed"

      - name: Record docs/demo.tape
        # vhs is pinned below. What it installs to do the work, ttyd and ffmpeg, is
        # not, and vhs-action v2.1.1 offers no input for either, so pinning them
        # would mean dropping the action and installing all three by hand. It is not
        # worth that here: this job holds no token and its checkout holds no
        # credentials, so the worst an unpinned ttyd can do is produce a bad GIF,
        # which the job below commits as one file and a person looks at.
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/demo.tape
          # v0.11.0 rather than v0.12.0. v0.12.0 shipped on 2026-09-09, the day this
          # job first failed, and on this runner it prints that it is creating the
          # GIF, exits 0 and writes no file, whatever the tape contains. Reported
          # upstream as charmbracelet/vhs#787, with the two runs that differ only in
          # this line. Raise the pin when that is fixed; the tape needs nothing
          # v0.12.0 added, so there is no hurry.
          version: v0.11.0

      - name: Put the recording where the rest of this job expects it
        # vhs prints "Creating docs/demo.gif..." and resolves that path against its own
        # working directory, which is not necessarily the workspace root, so the file
        # can land somewhere the upload and the commit below do not look. This finds it
        # wherever it went and puts it in place, and says what it found either way, so
        # a future failure names the path instead of only the absence.
        run: |
          if [ -f docs/demo.gif ]; then
            echo "docs/demo.gif is where it should be"
            ls -l docs/demo.gif
            exit 0
          fi
          echo "docs/demo.gif is missing; looking for it"
          found=$(find "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" -name 'demo.gif' -type f 2>/dev/null | head -1)
          if [ -z "${found}" ]; then
            echo "::error::vhs reported creating the recording but no demo.gif exists anywhere under the workspace or the runner temp"
            find "${GITHUB_WORKSPACE}" -name '*.gif' -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "found it at ${found}"
          mkdir -p docs
          mv "${found}" docs/demo.gif
          ls -l docs/demo.gif

      - name: Upload the recording as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo
          path: docs/demo.gif
          if-no-files-found: error

  commit:
    name: commit docs/demo.gif
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with a write credential, and everything it runs it brought with
    # it: a checkout, one downloaded artifact, and git.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: demo
          path: docs

      - name: Commit the recording to the branch this run started from
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # One path, named here rather than "git add -A", so a job that somehow
          # ended up with more than the recording still commits only the recording.
          git add docs/demo.gif
          if git diff --cached --quiet; then
            echo "docs/demo.gif is unchanged; nothing to commit"
            exit 0
          fi
          # The bot authors what the bot made. It used to commit under a person's
          # name and address, which put a human signature on bytes produced by
          # third-party tooling that person never saw.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: refresh demo recording"
          git push origin "HEAD:${BRANCH}"
