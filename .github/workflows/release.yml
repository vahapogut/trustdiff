# Release pipeline: on every v* tag, build the archives with goreleaser, sign
# checksums.txt with cosign (keyless, Sigstore bundle), generate SBOMs with
# syft, publish the GitHub release and attest build provenance.
#
# Every action is pinned to a full commit SHA; the trailing comment names the
# tag that SHA was resolved from. Pins, tool versions and action inputs were
# verified against the upstream repositories on 2026-09-09.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore keyless signing and the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      # v0.4.1 went green while publishing nothing to either tap. The secret was
      # there and its value was empty, which is what goreleaser's isEnvSet reads as
      # unset, so both blocks logged skip_upload and the job finished. A release
      # that cannot write the taps has to say so before it builds anything, not
      # leave brew and scoop on the version before it.
      #
      # A prerelease is exempt because it deliberately publishes no tap at all
      # (skip_upload is auto), which is what makes a candidate safe to push, and
      # demanding a token it will not use would take that away.
      - name: Refuse to build a release that cannot write the taps
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*)
              echo "::notice::${GITHUB_REF_NAME} is a prerelease, which publishes no tap; the tap token is not needed"
              exit 0
              ;;
          esac
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::TAP_GITHUB_TOKEN is empty or unset, so goreleaser would skip both tap uploads and this release would leave brew and scoop on the previous version. A secret set to the empty string looks exactly like a working one in the secret list; the step header above prints *** for a secret that holds something. See docs/releasing.md section 6.3."
            exit 1
          fi

      - name: Check out the tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly the toolchain go.mod names, and no check-latest. SECURITY.md
          # says a tag can be rebuilt and compared byte for byte, and "1.26.x" with
          # check-latest made that false the moment a new patch release existed:
          # the same tag rebuilt next month would be built by a different compiler.
          # This is the one job where that matters. Everything in ci.yml still
          # floats forward on purpose, so govulncheck sees the newest standard
          # library rather than the one this pin freezes.
          #
          # It has to be written out. go-version-file reads the toolchain directive
          # only when GOTOOLCHAIN is not "local" (actions/setup-go at the sha above,
          # src/installer.ts, read 2026-09-11), so go-version-file plus
          # GOTOOLCHAIN: local installs the bare "go 1.26.0" directive version and
          # silently drops eight patch releases. internal/cli
          # TestReleasePinsTheToolchainGoModNames fails when this and go.mod differ.
          go-version: "1.26.8"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The installer's default is v3.0.6; tools.mk pins v3.1.3. The
          # installer verifies the requested release with a bootstrap cosign.
          cosign-release: v3.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Newest syft release on 2026-09-09. The action adds it to PATH.
          syft-version: v1.51.1

      - name: Compute SOURCE_DATE_EPOCH from the tagged commit
        id: epoch
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish with goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
          # The token that lets goreleaser push the Homebrew cask and the Scoop
          # manifest into the tap repositories, which the job's own GITHUB_TOKEN
          # cannot reach because they are other repositories. When the secret is
          # not set the two blocks skip their upload and the release still
          # succeeds; docs/releasing.md says what the token needs.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        # The archives and checksums.txt are the subjects; the SPDX documents beside
        # them are left out on purpose rather than forgotten. goreleaser hashes every
        # artifact it uploads into checksums.txt, the SBOMs included (v0.4.1's file
        # lists all six .spdx.json entries), and checksums.txt is the one artifact
        # cosign signs, so a changed SBOM is already detectable through that
        # signature. Add "dist/*.spdx.json" below when something starts verifying an
        # SBOM's provenance directly, which nothing this project ships does today.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # goreleaser reports skip_upload as a notice and exits 0, so a tap that was
      # not written is invisible in a green job. This reads the two repositories
      # back and fails when either still serves the version before this one.
      #
      # It reads with the job's own GITHUB_TOKEN rather than with the tap token:
      # both repositories are public, the read needs no write credential, and the
      # tap token is scoped to writing them. A prerelease publishes no tap, and a
      # first publish creates the files, so neither is a failure here.
      - name: Verify the tap and the bucket serve this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*)
              echo "::notice::${GITHUB_REF_NAME} is a prerelease, which leaves both taps where they were"
              exit 0
              ;;
          esac
          want="${GITHUB_REF_NAME#v}"
          read_tap() {
            gh api "repos/vahapogut/$1/contents/$2" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true
          }
          # Five reads, four ten second waits between them: the contents API is
          # served from a cache that can lag a push by a few seconds.
          for attempt in 1 2 3 4 5; do
            cask=$(read_tap homebrew-tap Casks/trustdiff.rb | sed -n 's/^ *version "\([^"]*\)".*/\1/p' | head -1)
            manifest=$(read_tap scoop-bucket bucket/trustdiff.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -1)
            if [ "${cask}" = "${want}" ] && [ "${manifest}" = "${want}" ]; then
              echo "::notice::the cask and the manifest both serve ${want}"
              exit 0
            fi
            echo "attempt ${attempt}: cask ${cask:-<unread>}, manifest ${manifest:-<unread>}, want ${want}"
            if [ "${attempt}" -lt 5 ]; then
              sleep 10
            fi
          done
          echo "::error::the tap repositories do not serve ${want}: Casks/trustdiff.rb is ${cask:-unreadable} and bucket/trustdiff.json is ${manifest:-unreadable}. The release exists; brew and scoop still hand out what they had. docs/releasing.md section 6 says how to place them by hand and what the job needs to do it itself."
          exit 1

