# Tests for the Bun security scanner adapter in integrations/bun-scanner.
#
# The adapter is JavaScript and its tests need Bun, so it gets a workflow of its own
# rather than a job bolted onto the Go CI. It runs on Linux and on Windows because the
# adapter spawns a process and the two platforms resolve and start executables
# differently, which is exactly the part a unit test on one platform would not catch.
#
# This workflow does not publish anything and needs no credential. Publishing the package
# to npm needs a trusted publisher configured by the repository owner under their own
# account; integrations/bun-scanner/README.md says what that takes.
#
# Every "uses:" reference is pinned to a full commit SHA and the trailing comment names
# the tag. Pins were resolved on 2026-09-10 with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object | "\(.type) \(.sha)"'
# and both are lightweight tags, so no dereferencing step was needed:
#   actions/checkout v7.0.1     3d3c42e5aac5ba805825da76410c181273ba90b1
#   oven-sh/setup-bun v2.2.0    0c5077e51419868618aeaa5fe8019c62421857d6

name: bun-scanner

on:
  push:
    branches: [main]
    paths:
      - "integrations/bun-scanner/**"
      - ".github/workflows/bun-scanner.yml"
  pull_request:
    paths:
      - "integrations/bun-scanner/**"
      - ".github/workflows/bun-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per event kind and ref, as in the other workflows of this repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: bun test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: integrations/bun-scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned rather than "latest" so a Bun release cannot turn a green pull request
          # red overnight. 1.4.2 was the current release on 2026-09-10; the package's
          # engines field asks only for 1.3.0 or newer, which is the release that
          # introduced the Security Scanner API.
          bun-version: "1.4.2"

      - name: The package must have no dependencies of any kind
        # This is what makes the test step below possible without a network: with no
        # dependencies there is nothing to install, so "bun install" is never run and no
        # registry is ever contacted. It is also the promise the README makes to anyone
        # who installs the package, so it is worth failing the build over.
        run: |
          for field in dependencies devDependencies peerDependencies optionalDependencies; do
            count=$(bun --print "Object.keys(require('./package.json').${field} ?? {}).length")
            echo "${field}: ${count}"
            if [ "${count}" != "0" ]; then
              echo "::error::package.json declares ${field}, and this package must have none"
              exit 1
            fi
          done
          if [ -e node_modules ] || [ -e bun.lock ] || [ -e bun.lockb ]; then
            echo "::error::an install artifact is checked in; the package needs no install"
            exit 1
          fi

      - name: bun test
        env:
          # Nothing here should reach the network: the tests run a stub binary written to
          # a temporary directory, never the real trustdiff and never a registry. Pointing
          # the proxy variables at a closed port turns any accidental request into an
          # immediate failure instead of a silent success, so "offline" is enforced rather
          # than asserted. Port 9 is the discard port and nothing listens on it here.
          #
          # Only the upper case spellings are set. The env context of a workflow is
          # case insensitive, so listing http_proxy beside HTTP_PROXY is a duplicate
          # key and the whole file is rejected before a single job starts, which is
          # what this job did from the day it was written until 2026-09-10. Bun reads
          # either case, so one is enough.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          # setup-bun and Bun itself both look at this; there is nothing to report anyway.
          DO_NOT_TRACK: "1"
        run: bun test
