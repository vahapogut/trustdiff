# Hand written for the parser tests: one package per source kind, packages whose
# hash the file leaves out, the two places a project states its own dependencies,
# and two versions of one package so that a dependency pinned by version marks only
# the version it names. uv did not write this file.
version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = ["member-package"]
requirements = [{ name = "From_Manifest" }]

[manifest.dependency-groups]
lint = [{ name = "from-manifest-group" }]

[[package]]
name = "editable-member"
version = "0.2.0"
source = { editable = "packages/editable" }
dependencies = [
    { name = "from-editable" },
]

[[package]]
name = "example-project"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "Flask_SQLAlchemy" },
    { name = "from-registry" },
    { name = "two-versions", version = "2.0.0" },
]

[package.optional-dependencies]
speedups = [
    { name = "from-url" },
]

[package.dev-dependencies]
dev = [
    { name = "from-git" },
]

