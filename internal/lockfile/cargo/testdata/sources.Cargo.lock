# Hand written for the parser tests: one package per source kind, a package whose
# checksum the file leaves out, and two versions of one crate so that a dependency
# pinned by version marks only the version it names. Cargo did not write this file.
version = 4

[[package]]
name = "workspace-root"
version = "0.1.0"
dependencies = [
 "Inflector",
 "from-git",
 "from-elsewhere",
 "from-path",
 "from-registry",
 "from-sparse-registry",
 "no-checksum",
 "two-versions 2.0.0",
]

[[package]]
name = "Inflector"
version = "0.11.4"
source = "registry+https://github.com/rust-lang/crates.io-index"
checksum = "fe438c63458706e03479442743baae6c88256498e6431708f6dfc520a26515d3"

