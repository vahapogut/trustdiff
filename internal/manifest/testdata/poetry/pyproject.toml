[tool.poetry]
name = "trustdiff-fixture-poetry"
version = "0.1.0"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31"
attrs = "*"
click = { version = "~8.1", optional = true }
rich = { version = ">=13,<14", extras = ["jupyter"], markers = "sys_platform == 'linux'" }
local = { path = "../local" }
forked = { git = "https://example.test/forked.git" }
archived = { url = "https://example.test/archived-1.0.tar.gz" }

[tool.poetry.dev-dependencies]
black = "^24"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
