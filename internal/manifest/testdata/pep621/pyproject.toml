[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustdiff-fixture"
version = "1.0.0"
dependencies = [
  "requests>=2.31,<3",
  "urllib3[socks,brotli] >= 1.26 ; python_version < '3.12'",
  "packaging",
  "pinned == 24.1",
  "vendored @ https://example.test/vendored-1.0.tar.gz",
]

[project.optional-dependencies]
dev = ["pytest~=7.4"]
docs = ["sphinx (>=7)"]
