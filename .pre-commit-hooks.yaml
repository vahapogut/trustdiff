# trustdiff as a pre-commit hook. Add it to a repository's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/vahapogut/trustdiff
#       rev: v0.6.0
#       hooks:
#         - id: trustdiff-diff
#
# pre-commit builds the binary from this repository at the pinned rev, so the hook
# needs a Go toolchain and no release download. The keys below are the ones
# documented at https://pre-commit.com/#creating-new-hooks (checked 2026-09-09).
#
# The subcommand lives in "entry" and only the level lives in "args", because a
# repository that sets "args" in its own configuration replaces this list
# entirely: keeping "diff" out of it means a relaxed level cannot accidentally
# turn the hook into a run of trustdiff without a command.
- id: trustdiff-diff
  name: trustdiff (lockfile trust diff)
  description: Evaluate what the staged lockfile change adds or modifies for trust regressions.
  entry: trustdiff diff
  args: ["--fail-on", "block"]
  language: golang
  # diff reads the lockfiles from git itself, so the staged file names would only
  # be repeated arguments it does not accept.
  pass_filenames: false
  # Every format the parsers of this release read, matched case-insensitively the
  # way internal/lockfile detects them. It named four of the nine through v0.5.0, so
  # a yarn.lock, bun.lock, deno.lock, poetry.lock or requirements file could change
  # and the hook would never run: installed, green and not looking. The rev above
  # names the first release that carries the full list, because a reader who pins an
  # earlier one gets the four name gate however current this file looks.
  #
  # This decides whether the hook runs, not what it reads. pass_filenames is false
  # below and diff finds the lockfiles in git itself, so a pattern wider than the
  # parsers costs one run that reports nothing while a narrower one costs the gate.
  # That is why the requirements shapes are matched loosely here and precisely in
  # internal/lockfile/pipreq: system-requirements.txt starts a run that says
  # nothing, which is the cheap way to be wrong.
  #
  # internal/lockfile TestPreCommitHookRunsOnEveryFormatTheParsersRead builds the
  # list from the registered parsers and fails when this line falls behind them.
  files: '(?i)(^|/)(cargo\.lock|bun\.lock|deno\.lock|poetry\.lock|uv\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|[^/]*requirements[^/]*\.txt|requirements/[^/]+\.txt)$'
  stages: [pre-commit]
  # 3.2.0 is where the values of "stages" became the git hook names; before it
  # this hook would have to say "commit" instead of "pre-commit".
  minimum_pre_commit_version: "3.2.0"
